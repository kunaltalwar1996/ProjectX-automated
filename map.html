      <a href="/index.html" class="text-xl font-black tracking-tighter text-slate-900">EstatePro</a>

        <a href="/map.html" class="text-sm font-bold text-slate-900 border-b-2 border-slate-900 pb-1">Rent</a>

      <div class="flex items-center gap-4">
        <a href="/admin-panel.html" class="bg-slate-900 text-white px-5 py-2 rounded-xl text-sm font-bold hover:bg-slate-800 transition-colors shadow-sm">Dashboard</a>

  <!-- Main Split Layout -->

        <button class="w-12 h-12 bg-white rounded-2xl shadow-xl flex items-center justify-center text-slate-900 hover:bg-slate-50 transition-colors">
          <span class="material-symbols-outlined">add</span>
        </button>
        <button class="w-12 h-12 bg-white rounded-2xl shadow-xl flex items-center justify-center text-slate-900 hover:bg-slate-50 transition-colors">

          <button class="px-4 py-2 bg-slate-50 border border-slate-200 text-slate-600 rounded-full text-[10px] font-black uppercase tracking-widest whitespace-nowrap">Beds/Baths</button>
        </div>
      </div>

                <span class="text-xs font-black text-slate-900">4</span>
              </div>
              <div class="flex items-center gap-1.5">
                <span class="material-symbols-outlined text-[18px]">bathtub</span>
                <span class="text-xs font-black text-slate-900">3.5</span>
              </div>
              <div class="flex items-center gap-1.5">

              <div class="flex items-center gap-1.5">
                <span class="material-symbols-outlined text-[18px]">bathtub</span>
                <span class="text-xs font-black text-slate-900">2</span>
