<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>ProjectX - Search Your Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/style.css">
  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <!-- Leaflet Map JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="/auth.js"></script>
  <script type="module" src="/demo-data.js"></script>
  <style>
    #map { background: #f8fafc; }
    .leaflet-popup-content-wrapper { border-radius: 20px; padding: 4px; }
    .leaflet-popup-tip { display: none; }
    .leaflet-container { font-family: 'Inter', sans-serif !important; }
    /* Custom Pin Styles */
    .custom-price-pin {
        background: white;
        border: 2px solid #0f172a; /* slate-900 */
        color: #0f172a;
        font-weight: 800;
        font-size: 12px;
        padding: 4px 8px;
        border-radius: 20px;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        text-align: center;
        white-space: nowrap;
        transition: all 0.3s ease;
        position: relative;
    }
    .custom-price-pin::after {
        content: '';
        position: absolute;
        bottom: -6px;
        left: 50%;
        transform: translateX(-50%);
        border-width: 6px 6px 0;
        border-style: solid;
        border-color: #0f172a transparent transparent transparent;
        display: block;
    }
    .custom-price-pin.active-pin {
        background: #0f172a;
        color: white;
        transform: scale(1.15);
        z-index: 1000 !important;
        box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3);
    }
    .custom-price-pin.active-pin::after {
        border-color: #0f172a transparent transparent transparent;
    }
    #map-pane { transition: all 0.3s ease; }
    #list-pane { transition: all 0.3s ease; }
    .view-toggle-btn.active {
      background: #0f172a;
      color: white;
    }
  </style>
</head>
<body class="bg-white text-slate-900 font-['Outfit'] antialiased h-screen overflow-hidden flex flex-col">
  <!-- Top Navigation (Standardized) -->
  <nav class="w-full z-50 bg-white border-b border-slate-200 shadow-sm h-16 shrink-0 flex items-center">
    <div class="max-w-[1280px] mx-auto px-6 w-full flex items-center justify-between gap-8">
      <!-- Brand -->
      <div class="flex items-center gap-2">
        <a href="/index.html" class="text-xl font-black tracking-tighter text-slate-900">ProjectX</a>
      </div>
      <!-- Navigation Links -->
      <div class="hidden md:flex items-center gap-8">
        <a class="text-[13px] font-bold text-slate-500 hover:text-slate-900 transition-colors uppercase tracking-widest pb-1"
          href="/map.html">Search Your Home</a>

        <!-- Services Dropdown -->
        <div class="relative group">
          <button class="text-[13px] font-bold text-slate-500 hover:text-slate-900 transition-colors uppercase tracking-widest pb-1 flex items-center gap-1">
            Services
            <span class="material-symbols-outlined text-[16px]">expand_more</span>
          </button>
          <div class="absolute top-full left-0 mt-2 w-48 bg-white border border-slate-200 rounded-xl shadow-xl overflow-hidden opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50">
            <a href="/sell.html" class="flex items-center gap-3 px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-slate-900 transition-colors">
              <span class="material-symbols-outlined text-[18px] text-slate-400">sell</span>
              Sell Property
            </a>
            <a href="/sell.html" class="flex items-center gap-3 px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-slate-900 transition-colors border-t border-slate-100">
              <span class="material-symbols-outlined text-[18px] text-slate-400">home</span>
              Rent Your Property
            </a>
          </div>
        </div>
      </div>
      <!-- Trailing Actions -->
      <div class="flex items-center gap-4">
        <button class="text-slate-500 hover:text-slate-900 transition-colors">
          <span class="material-symbols-outlined text-[24px]">account_circle</span>
        </button>
        <button class="bg-slate-900 text-white px-5 py-2 rounded-lg font-bold text-xs hover:bg-slate-800 transition-colors uppercase tracking-wider ml-2">
          Dashboard
        </button>
      </div>
    </div>
  </nav>

  <!-- View Toggle Toolbar -->
  <div class="shrink-0 bg-white border-b border-slate-200 px-6 py-2 flex items-center justify-between gap-4 z-40">
    <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-lg">
      <button id="toggle-split" class="view-toggle-btn active flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-black uppercase tracking-widest transition-all">
        <span class="material-symbols-outlined text-[16px]">view_sidebar</span>
        Split
      </button>
      <button id="toggle-map" class="view-toggle-btn flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-black uppercase tracking-widest text-slate-500 transition-all">
        <span class="material-symbols-outlined text-[16px]">map</span>
        Map
      </button>
      <button id="toggle-list" class="view-toggle-btn flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-black uppercase tracking-widest text-slate-500 transition-all">
        <span class="material-symbols-outlined text-[16px]">view_list</span>
        List
      </button>
    </div>
    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest" id="map-listings-count-toolbar">Loading...</p>
  </div>

  <main id="main-split" class="flex-grow flex flex-col lg:flex-row overflow-hidden">
    <!-- Left Pane: Map -->
    <section id="map-pane" class="flex-1 shrink-0 bg-slate-100 relative min-h-[300px]">
      <!-- OpenStreetMap Container -->
      <div id="map" class="absolute inset-0 z-0"></div>
      
      <!-- Map Search Bar -->
      <div class="absolute top-4 left-1/2 -translate-x-1/2 z-[1000] w-[90%] max-w-sm">
        <div class="bg-white rounded-full shadow-lg border border-slate-200 flex items-center p-1">
          <span class="material-symbols-outlined text-slate-400 pl-3">location_on</span>
          <input type="text" id="map-location-search" placeholder="Search neighborhood..." class="w-full py-2 px-3 text-sm font-medium text-slate-900 outline-none bg-transparent" autocomplete="off">
          <button id="map-search-btn" class="bg-slate-900 text-white w-9 h-9 rounded-full flex items-center justify-center hover:bg-slate-800 transition-colors mr-1 shrink-0">
            <span class="material-symbols-outlined text-[18px]">search</span>
          </button>
        </div>
        <div id="map-search-results" class="mt-2 bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden hidden flex-col max-h-64 overflow-y-auto"></div>
      </div>
    </section>

    <!-- Right Pane: Listings Sidebar -->
    <section id="list-pane" class="w-full lg:w-[420px] bg-white border-l border-slate-100 flex flex-col overflow-hidden shadow-2xl z-10 shrink-0">
      <div class="shrink-0 border-b border-slate-100">
        <!-- Filter bar -->
        <div class="px-4 pt-4 pb-3 space-y-3">
          <div class="flex items-center justify-between">
            <h2 class="text-base font-black text-slate-900 tracking-tight">Results</h2>
            <p class="text-slate-400 text-[10px] font-black uppercase tracking-widest" id="map-listings-count">Loading...</p>
          </div>
          <!-- Intent toggle -->
          <div class="flex gap-2">
            <button data-intent="all" class="intent-btn flex-1 py-1.5 rounded-lg text-[11px] font-black uppercase tracking-widest bg-slate-900 text-white transition-all">All</button>
            <button data-intent="Buy" class="intent-btn flex-1 py-1.5 rounded-lg text-[11px] font-black uppercase tracking-widest bg-slate-100 text-slate-500 hover:bg-slate-200 transition-all">Buy</button>
            <button data-intent="Rent" class="intent-btn flex-1 py-1.5 rounded-lg text-[11px] font-black uppercase tracking-widest bg-slate-100 text-slate-500 hover:bg-slate-200 transition-all">Rent</button>
          </div>
          <!-- Type chips -->
          <div class="flex gap-1.5 flex-wrap">
            <button data-type="all" class="type-btn px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest bg-slate-900 text-white transition-all">All</button>
            <button data-type="Apartment" class="type-btn px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest bg-slate-100 text-slate-500 hover:bg-slate-200 transition-all">Apt</button>
            <button data-type="Villa" class="type-btn px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest bg-slate-100 text-slate-500 hover:bg-slate-200 transition-all">Villa</button>
            <button data-type="Penthouse" class="type-btn px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest bg-slate-100 text-slate-500 hover:bg-slate-200 transition-all">PH</button>
            <button data-type="Office" class="type-btn px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest bg-slate-100 text-slate-500 hover:bg-slate-200 transition-all">Office</button>
          </div>
          <!-- Price range -->
          <div class="flex gap-2 items-center">
            <input type="number" id="list-price-min" placeholder="Min Cr" class="flex-1 px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs font-medium outline-none focus:border-slate-900 transition-colors">
            <span class="text-slate-300 text-xs font-bold">—</span>
            <input type="number" id="list-price-max" placeholder="Max Cr" class="flex-1 px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs font-medium outline-none focus:border-slate-900 transition-colors">
            <button id="list-apply-filters" class="px-3 py-1.5 bg-slate-900 text-white rounded-lg text-[10px] font-black uppercase tracking-widest hover:bg-slate-800 transition-colors">Go</button>
          </div>
        </div>
      </div>

      <div class="flex-grow overflow-y-auto p-6 space-y-6">
        <!-- Injected dynamically by JS -->
      </div>

    </section>
  </main>
<script type="module">
  import { supabase } from './lib/supabase.js';

  // Synchronous monkey-patching of Leaflet to intercept map and markers
  const activeMarkers = new Set();
  let mapInstance = null;
  let allListingsMap = new Map();
  let listingsLoaded = false;

  window._mapIntentFilter = null;
  window._mapTypeFilter = null;
  window._mapPriceMin = null;
  window._mapPriceMax = null;

  if (typeof L !== 'undefined') {
    const originalMap = L.map;
    L.map = function(id, options) {
      const m = originalMap(id, options);
      mapInstance = m;
      return m;
    };

    const originalMarker = L.marker;
    L.marker = function(latlng, options) {
      const marker = originalMarker(latlng, options);
      activeMarkers.add(marker);
      marker.on('add', () => {
        const id = getListingId(marker);
        if (id) {
          const listing = allListingsMap.get(id);
          if (listing && isFilteredOut(listing)) {
            setTimeout(() => {
              const el = marker.getElement();
              if (el) el.style.display = 'none';
            }, 0);
          }
        }
      });
      return marker;
    };

    const originalContains = L.LatLngBounds.prototype.contains;
    L.LatLngBounds.prototype.contains = function(latlng) {
      let lat, lng;
      if (Array.isArray(latlng)) {
        lat = latlng[0];
        lng = latlng[1];
      } else if (latlng && typeof latlng === 'object') {
        lat = latlng.lat;
        lng = latlng.lng;
      }
      
      // Find if there is any active listing matching these coordinates that is filtered out
      for (const listing of allListingsMap.values()) {
        if (Math.abs(listing.lat - lat) < 0.0001 && Math.abs(listing.lng - lng) < 0.0001) {
          if (isFilteredOut(listing)) {
            return false;
          }
        }
      }
      
      return originalContains.call(this, latlng);
    };
  }

  function getListingId(marker) {
    const html = marker.options?.icon?.options?.html;
    if (!html) return null;
    const match = html.match(/id="pin-(\d+)"/);
    return match ? parseInt(match[1]) : null;
  }

  function isFilteredOut(listing) {
    if (!listingsLoaded) return false;
    if (window._mapIntentFilter && listing.intent !== window._mapIntentFilter) {
      return true;
    }
    if (window._mapTypeFilter && listing.type !== window._mapTypeFilter) {
      return true;
    }
    if (window._mapPriceMin !== null && window._mapPriceMin !== undefined && !isNaN(window._mapPriceMin)) {
      if (listing.price < window._mapPriceMin) {
        return true;
      }
    }
    if (window._mapPriceMax !== null && window._mapPriceMax !== undefined && !isNaN(window._mapPriceMax)) {
      if (listing.price > window._mapPriceMax) {
        return true;
      }
    }
    return false;
  }

  async function loadListings() {
    try {
      const { data, error } = await supabase.from('listings').select('*').eq('status', 'Active');
      if (error) throw error;
      if (data) {
        data.forEach(l => {
          allListingsMap.set(l.id, {
            ...l,
            price: parseFloat(l.price),
            lat: parseFloat(l.lat),
            lng: parseFloat(l.lng)
          });
        });
      }
    } catch (err) {
      console.error('Error loading listings for map filters:', err);
    } finally {
      listingsLoaded = true;
      window._applyMapFilters();
    }
  }

  window._applyMapFilters = function() {
    activeMarkers.forEach(marker => {
      const id = getListingId(marker);
      if (id) {
        const listing = allListingsMap.get(id);
        const element = marker.getElement();
        if (listing && isFilteredOut(listing)) {
          if (element) element.style.display = 'none';
          if (mapInstance && mapInstance.hasLayer(marker) && marker.isPopupOpen()) {
            marker.closePopup();
          }
        } else {
          if (element) element.style.display = '';
        }
      }
    });

    if (mapInstance) {
      mapInstance.fire('moveend');
    }
  };

  // Initial load
  loadListings();

  document.addEventListener('DOMContentLoaded', () => {
    const mapPane = document.getElementById('map-pane');
    const listPane = document.getElementById('list-pane');
    const btnSplit = document.getElementById('toggle-split');
    const btnMap = document.getElementById('toggle-map');
    const btnList = document.getElementById('toggle-list');
    const allToggleBtns = [btnSplit, btnMap, btnList];

    function setActive(btn) {
      allToggleBtns.forEach(b => {
        b.classList.remove('active');
        b.classList.add('text-slate-500');
        b.classList.remove('text-white');
      });
      btn.classList.add('active');
      btn.classList.remove('text-slate-500');
    }

    btnSplit.addEventListener('click', () => {
      setActive(btnSplit);
      mapPane.style.display = '';
      listPane.style.display = '';
      mapPane.className = 'flex-1 shrink-0 bg-slate-100 relative min-h-[300px]';
      listPane.className = 'w-full lg:w-[420px] bg-white border-l border-slate-100 flex flex-col overflow-hidden shadow-2xl z-10 shrink-0';
      setTimeout(() => window.dispatchEvent(new Event('resize')), 350);
    });

    btnMap.addEventListener('click', () => {
      setActive(btnMap);
      mapPane.style.display = '';
      listPane.style.display = 'none';
      mapPane.className = 'flex-1 bg-slate-100 relative';
      setTimeout(() => window.dispatchEvent(new Event('resize')), 350);
    });

    btnList.addEventListener('click', () => {
      setActive(btnList);
      mapPane.style.display = 'none';
      listPane.style.display = '';
      listPane.className = 'flex-1 bg-white flex flex-col overflow-hidden';
      setTimeout(() => window.dispatchEvent(new Event('resize')), 350);
    });

    // Sync toolbar count with sidebar count
    const sidebarCount = document.getElementById('map-listings-count');
    const toolbarCount = document.getElementById('map-listings-count-toolbar');
    if (sidebarCount && toolbarCount) {
      const observer = new MutationObserver(() => {
        toolbarCount.textContent = sidebarCount.textContent;
      });
      observer.observe(sidebarCount, { childList: true, characterData: true, subtree: true });
    }

    // Intent filter buttons
    document.querySelectorAll('.intent-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.intent-btn').forEach(b => {
          b.classList.remove('bg-slate-900', 'text-white');
          b.classList.add('bg-slate-100', 'text-slate-500');
        });
        btn.classList.add('bg-slate-900', 'text-white');
        btn.classList.remove('bg-slate-100', 'text-slate-500');
        window._mapIntentFilter = btn.dataset.intent === 'all' ? null : btn.dataset.intent;
        window._applyMapFilters();
      });
    });

    // Type filter chips
    document.querySelectorAll('.type-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.type-btn').forEach(b => {
          b.classList.remove('bg-slate-900', 'text-white');
          b.classList.add('bg-slate-100', 'text-slate-500');
        });
        btn.classList.add('bg-slate-900', 'text-white');
        btn.classList.remove('bg-slate-100', 'text-slate-500');
        window._mapTypeFilter = btn.dataset.type === 'all' ? null : btn.dataset.type;
        window._applyMapFilters();
      });
    });

    // Price filter
    document.getElementById('list-apply-filters')?.addEventListener('click', () => {
      window._mapPriceMin = parseFloat(document.getElementById('list-price-min').value) || null;
      window._mapPriceMax = parseFloat(document.getElementById('list-price-max').value) || null;
      window._applyMapFilters();
    });
  });
</script>
</body>
</html>
